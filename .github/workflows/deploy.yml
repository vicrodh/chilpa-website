name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Sent by vicrodh/chilpa when a release is published (see README).
  repository_dispatch:
    types: [chilpa-release]
  # Fallback: a new release reaches the site within the hour even without
  # the dispatch. Unchanged builds are not deployed.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.digest.outputs.value }}
      changed: ${{ steps.deployed.outputs.cache-hit != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build with the releases of vicrodh/chilpa
        run: npm run build -- --strict
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - id: digest
        run: echo "value=$(cd dist && find . -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -c1-64)" >> "$GITHUB_OUTPUT"
      - id: deployed
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deployed
          key: deployed-${{ steps.digest.outputs.value }}
          lookup-only: true
      - if: steps.deployed.outputs.cache-hit != 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Records the deployed build so the hourly run can skip an identical one.
  remember:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    steps:
      - run: mkdir .deployed && echo '${{ needs.build.outputs.digest }}' > .deployed/digest
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .deployed
          key: deployed-${{ needs.build.outputs.digest }}
